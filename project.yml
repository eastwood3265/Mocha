name: Mocha
options:
  bundleIdPrefix: com.eastwood
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
targets:
  Mocha:
    type: application
    platform: iOS
    sources: [Mocha]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eastwood.mocha
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mocha
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [MochaTests]
  MochaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MochaTests]
    dependencies:
      - target: Mocha
