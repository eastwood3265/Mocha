name: Mocha
options:
  bundleIdPrefix: com.eastwood
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: AS4SD8AP56
packages:
  CoreXLSX:
    url: https://github.com/CoreOffice/CoreXLSX.git
    from: 0.14.2
targets:
  Mocha:
    type: application
    platform: iOS
    sources: [Mocha]
    dependencies:
      - package: CoreXLSX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eastwood.mocha
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mocha
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [MochaTests]
  MochaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MochaTests]
    dependencies:
      - target: Mocha
